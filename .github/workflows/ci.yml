name: CI

on:
  push:
    branches:
      - master
      - codex/development
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rs_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rs_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_TEST_DB: rs_server_test
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: node .yarn/releases/yarn-3.6.3.cjs install --immutable
      - name: Prepare database
        run: bundle exec rails db:schema:load
      - name: Verify autoloading
        run: bundle exec rails zeitwerk:check
      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update
      - name: Run tests
        run: bundle exec rails test
      - name: Audit browser dependencies
        run: node .yarn/releases/yarn-3.6.3.cjs npm audit --all --recursive

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: rs_server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
