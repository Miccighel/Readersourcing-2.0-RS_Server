name: CI

on:
  push:
    branches:
      - master
      - codex/development
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rs_server_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rs_server_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_TEST_DB: rs_server_test
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install browser dependencies
        run: node .yarn/releases/yarn-3.6.3.cjs install --immutable
      - name: Prepare database
        run: bundle exec rails db:schema:load
      - name: Verify autoloading
        run: bundle exec rails zeitwerk:check
      - name: Audit Ruby dependencies
        run: bundle exec bundle-audit check --update
      - name: Run tests
        run: bundle exec rails test
      - name: Audit browser dependencies
        run: node .yarn/releases/yarn-3.6.3.cjs npm audit --all --recursive

  private-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Prepare and start an isolated private trial
        run: |
          trial_directory=$(mktemp -d "$RUNNER_TEMP/rs-server-private.XXXXXX")
          echo "TRIAL_DIRECTORY=$trial_directory" >> "$GITHUB_ENV"
          sh bin/private_trial prepare "$trial_directory"
          sh bin/private_trial start "$trial_directory"
      - name: Verify loopback access and authenticated mail capture
        run: |
          curl --fail --silent --output /dev/null http://127.0.0.1:33030/login
          mail_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:33031/)
          test "$mail_status" = 401
          project=$(sed -n '1p' "$TRIAL_DIRECTORY/project-name")
          docker compose --project-name "$project" --project-directory "$TRIAL_DIRECTORY" -f "$TRIAL_DIRECTORY/compose.yml" \
            exec -T rs_server_webapp ruby -rsocket -e '
              connected = false
              begin
                Socket.tcp("1.1.1.1", 443, connect_timeout: 3) { connected = true }
              rescue SystemCallError, IOError
              end
              abort "The private trial unexpectedly has an external TCP route" if connected
              puts "External TCP access is blocked in the private trial."
            '
      - name: Remove this runner's disposable trial
        if: always()
        run: |
          if [ -n "${TRIAL_DIRECTORY:-}" ] && [ -f "$TRIAL_DIRECTORY/project-name" ]; then
            project=$(sed -n '1p' "$TRIAL_DIRECTORY/project-name")
            if printf '%s\n' "$project" | grep -Eq '^rs-private-[0-9a-f]{12}$'; then
              docker compose --project-name "$project" --project-directory "$TRIAL_DIRECTORY" -f "$TRIAL_DIRECTORY/compose.yml" down --volumes
            fi
          fi

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          no-cache-filters: base
          push: false
          load: true
          tags: rs_server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime JSON outside Bundler
        run: |
          docker run --rm --network none --read-only --entrypoint ruby rs_server:ci -rjson -rbundler -e '
            locked = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.find { |spec| spec.name == "json" }
            abort "Runtime JSON differs from the lockfile" unless JSON::VERSION == locked.version.to_s
            abort "An older JSON library remains installed" unless Gem::Specification.find_all_by_name("json").all? { |spec| spec.version == locked.version }
            abort "JSON round trip failed" unless JSON.parse(JSON.generate({"reader" => [0, 50, 100]})) == {"reader" => [0, 50, 100]}
          '
      - name: Verify runtime resolver outside Bundler
        run: |
          docker run --rm --network none --read-only --entrypoint ruby rs_server:ci -rresolv -rbundler -e '
            locked = Bundler::LockfileParser.new(File.read("Gemfile.lock")).specs.find { |spec| spec.name == "resolv" }
            abort "Runtime resolver differs from the lockfile" unless Resolv::VERSION == locked.version.to_s
            abort "An older resolver remains installed" unless Gem::Specification.find_all_by_name("resolv").all? { |spec| spec.version == locked.version }
            message = Resolv::DNS::Message.new(123)
            message.add_question("example.test", Resolv::DNS::Resource::IN::A)
            abort "DNS round trip failed" unless Resolv::DNS::Message.decode(message.encode).id == 123
          '
