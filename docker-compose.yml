services:
  rs_server_setup:
    image: miccighel/rs_server:v2.0.0
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
      RAILS_ENV: production
    command: ["./bin/rails", "db:migrate"]
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /rs_server/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
      - /rs_server/log:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  rs_server_webapp:
    image: miccighel/rs_server:v2.0.0
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
      RAILS_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
      rs_server_setup:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /rs_server/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
      - /rs_server/log:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/up')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rs_server_publications:/rs_server/storage/publications/user

  database:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rs_server_pg_data:/var/lib/postgresql/data

volumes:
  rs_server_pg_data:
  rs_server_publications:
