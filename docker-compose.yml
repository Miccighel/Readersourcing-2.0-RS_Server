services:
  rs_server_webapp:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
      RAILS_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy

  database:
    image: postgres:17
    env_file: .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rs_server_pg_data:/var/lib/postgresql/data

volumes:
  rs_server_pg_data:
