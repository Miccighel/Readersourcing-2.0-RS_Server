x-logging: &default_logging
  driver: local
  options:
    max-size: "${RS_LOG_MAX_SIZE:-10m}"
    max-file: "${RS_LOG_MAX_FILES:-5}"

services:
  rs_server_setup:
    image: miccighel/rs_server:v2.0.0
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
      RAILS_ENV: production
    command: ["./bin/rails", "db:migrate"]
    restart: "no"
    cpus: "${RS_SERVER_CPU_LIMIT:-1.0}"
    mem_limit: "${RS_SERVER_MEMORY_LIMIT:-1g}"
    pids_limit: "${RS_SERVER_PID_LIMIT:-256}"
    depends_on:
      database:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /rs_server/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
      - /rs_server/log:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default_logging

  rs_server_webapp:
    image: miccighel/rs_server:v2.0.0
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: database
      RAILS_ENV: production
    ports:
      - "${RS_SERVER_BIND_ADDRESS:-127.0.0.1}:${RS_SERVER_PORT:-3000}:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "${RS_SERVER_CPU_LIMIT:-1.0}"
    mem_limit: "${RS_SERVER_MEMORY_LIMIT:-1g}"
    pids_limit: "${RS_SERVER_PID_LIMIT:-256}"
    depends_on:
      database:
        condition: service_healthy
      rs_server_setup:
        condition: service_completed_successfully
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
      - /rs_server/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
      - /rs_server/log:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "exit(Net::HTTP.get_response(URI('http://127.0.0.1:3000/ready')).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rs_server_publications:/rs_server/storage/publications/user
    logging: *default_logging

  database:
    image: postgres:17
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: "${RS_DATABASE_CPU_LIMIT:-1.0}"
    mem_limit: "${RS_DATABASE_MEMORY_LIMIT:-512m}"
    pids_limit: "${RS_DATABASE_PID_LIMIT:-128}"
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rs_server_pg_data:/var/lib/postgresql/data
    logging: *default_logging

volumes:
  rs_server_pg_data:
  rs_server_publications:
